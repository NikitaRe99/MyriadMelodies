name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version, e.g. v1.0.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw 'Use a version such as v1.0.0' }
      - name: Build and checks
        shell: pwsh
        run: ./tools/Test-Project.ps1
      - name: Publish
        shell: pwsh
        run: ./tools/Publish.ps1
      - name: Create draft with both EXEs and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:RELEASE_TAG" artifacts/release/MyriadMelodies-standalone-win-x64.exe artifacts/release/MyriadMelodies-runtime-required-win-x64.exe artifacts/release/SHA256SUMS.txt --draft --notes-file docs/RELEASE-NOTES.md --target "$env:GITHUB_SHA" --title "MyriadMelodies $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
