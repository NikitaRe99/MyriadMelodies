name: Build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build and checks without GPU
        shell: pwsh
        run: ./tools/Test-Project.ps1
      - name: Both EXE variants
        shell: pwsh
        run: ./tools/Publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: MyriadMelodies-win-x64
          path: |
            artifacts/release/MyriadMelodies-standalone-win-x64.exe
            artifacts/release/MyriadMelodies-runtime-required-win-x64.exe
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
